<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미장 — 종목 검색</title>
<link rel="icon" th:href="@{/img/favicon.png}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/tokens.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/header :: siteHeader}"></header>

<div class="page-wide">

  <div class="grid-2">
    <div>
      <div class="card searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" aria-label="티커 또는 종목명" autocomplete="off">
        <span class="hint">티커 또는 종목명</span>
      </div>
      <p class="recent" id="recent" hidden>
        <span class="k">최근 검색</span>
      </p>

      <section class="card">
        <h2 class="card-head">검색 결과 <span class="sub num" id="result-count">—</span></h2>

        <!-- 거래소 필터. ETF는 거래소가 아니지만 사용자가 찾는 단위라 같은 줄에 둔다 -->
        <div class="table-wrap">
          <table class="tbl tbl-band tbl-muted">
            <thead>
              <tr>
                <th scope="col">티커</th>
                <th class="txt" scope="col">종목명</th>
                <th scope="col">거래소</th>
                <th class="r" scope="col">현재가</th>
                <th class="r" scope="col">등락률</th>
                <th class="r" scope="col">관심</th>
              </tr>
            </thead>
            <tbody id="search-results">
              <!-- 스크립트가 채운다 -->
            </tbody>
          </table>
        </div>
      </section>

      <section class="card" id="all-card">
        <h2 class="card-head">전체 종목 <span class="sub num" id="all-count">—</span></h2>

        <div class="pills" id="ex-filter" data-toggle-group style="padding:0 18px 12px">
          <button type="button" data-value="ALL" aria-pressed="true">전체</button>
          <button type="button" data-value="NASDAQ" aria-pressed="false">NASDAQ</button>
          <button type="button" data-value="NYSE" aria-pressed="false">NYSE</button>
          <button type="button" data-value="AMEX" aria-pressed="false">AMEX</button>
          <button type="button" data-value="ETF" aria-pressed="false">ETF</button>
        </div>

        <div class="table-wrap">
          <table class="tbl tbl-band tbl-muted">
            <thead>
              <tr>
                <th scope="col">티커</th>
                <th class="txt" scope="col">종목명</th>
                <th scope="col">거래소</th>
                <th scope="col">종류</th>
                <th class="r" scope="col">관심</th>
              </tr>
            </thead>
            <tbody id="all-rows">
              <!-- 스크립트가 채운다 -->
            </tbody>
          </table>
        </div>

        <p class="more-wrap">
          <button class="btn btn-block" type="button" id="all-more">더보기</button>
        </p>
      </section>
    </div>

    <aside>
      <section class="card">
        <h2 class="card-head">인기 검색</h2>
        <p class="note" style="padding:18px">조회수를 모으기 시작하면 여기에 표시됩니다.</p>
      </section>
    </aside>
  </div>
</div>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/ui.js}"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/header-search.js}" defer></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/quotes.js}" defer></script>
<script th:attr="nonce=${cspNonce}">
/* 종목 검색 (SEARCH-01·02) · 관심종목 토글 (WATCH-01)
   벤더가 아니라 우리 DB 를 부른다. 응답이 빨라 타자에 붙어 나온다. */
(function () {
  var input = document.getElementById("q");
  var tbody = document.getElementById("search-results");
  var countEl = document.getElementById("result-count");
  if (!input || !tbody) return;

  /* 이미 담은 종목. 별표를 채울지 판단한다. 비로그인이면 비어 있다 */
  var watched = new Map();   // symbol -> watchlist item id
  var timer = null;
  var last = [];             // 마지막 검색 결과
  var exchange = "ALL";      // 아래 "전체 종목" 카드의 거래소 필터

  /* 응답 봉투를 벗겨 {성공 여부, 값} 으로 돌려준다.
     값만 돌려주면 안 된다 — 담기·빼기는 성공해도 data 가 null 이라
     값으로 성공을 판단하면 성공을 실패로 읽는다 */
  async function call(url, options) {
    var res = await fetch(url, options);
    if (res.status === 401) { location.href = "/login"; return { ok: false, data: null }; }
    var body = await res.json();
    return { ok: body.success === true, data: body.data };
  }

  /* 로그인했다면 담은 목록을 한 번 받아 둔다.
     행마다 물어보면 20종목에 20번이 된다 */
  async function loadWatched() {
    try {
      var res = await fetch("/api/watchlists");
      if (!res.ok) return;                 // 비로그인이면 401 — 조용히 넘어간다
      var body = await res.json();
      if (!body.success) return;
      body.data.forEach(function (w) { watched.set(w.symbol, w.id); });
    } catch (e) { /* 네트워크 실패. 별표만 비어 보인다 */ }
  }

  /**
   * 티커 칸을 채운다. 주소는 encodeURIComponent, 글자는 textContent 로 넣는다.
   * 둘 다 벤더가 준 문자열이라 HTML 로 해석될 자리에 그대로 두지 않는다.
   */
  function fillSymbolCell(td, stock) {
    var link = td.firstChild;
    link.setAttribute("href", "/stock?symbol=" + encodeURIComponent(stock.symbol));
    link.textContent = stock.symbol;
    if (!stock.active) {
      var bad = document.createElement("span");
      bad.className = "badge badge-err";
      bad.textContent = "거래 불가";
      td.append(" ", bad);
    }
  }

  /* 별표 단추. 티커가 data 속성으로 들어가므로 setAttribute 로 넣는다 */
  function fillStar(button, symbol, on) {
    button.setAttribute("data-symbol", symbol);
    button.setAttribute("aria-pressed", String(on));
    button.textContent = on ? "★" : "☆";
  }

  /* 한 줄을 만든다. 검색 API 는 시세를 주지 않아 가격 칸은 — 다 */
  /* 등락률 한 칸. 값이 없으면 0% 대신 — 을 둔다 —
     0% 는 "안 움직였다" 라는 뜻이라, 모른다는 것과 다르다 */
  function fillChange(cell, rate) {
    if (rate == null) {
      cell.className = "r sub";
      cell.textContent = "—";
      return;
    }
    var n = Number(rate);
    cell.className = "r num " + (n > 0 ? "rise" : n < 0 ? "fall" : "sub");
    cell.textContent = (n > 0 ? "+" : "") + n.toFixed(2) + "%";
  }

  function row(stock) {
    var tr = document.createElement("tr");
    var on = watched.has(stock.symbol);
    /* 뼈대만 innerHTML 로 세우고, 벤더가 준 문자열은 전부 textContent·setAttribute 로 넣는다.
       티커와 거래소도 벤더 문자열이다 — 종목명만 조심할 이유가 없다 */
    tr.innerHTML =
      '<td><a></a></td>' +
      '<td class="txt"></td>' +
      '<td></td>' +
      /* 현재가는 data-quote 를 달아 두면 quotes.js 가 실시간으로(장 마감이면 종가로)
         채워 준다. 등락률은 실시간 값에 기준가가 없어 서버가 준 것을 그대로 쓴다 */
      '<td class="r num">—</td>' +
      '<td class="r num"></td>' +
      '<td class="r"><button class="star" type="button" aria-label="관심 종목"></button></td>';
    fillSymbolCell(tr.children[0], stock);
    tr.children[2].textContent = stock.exchange || "—";
    tr.children[3].setAttribute("data-quote", stock.symbol);
    fillChange(tr.children[4], stock.dayChangeRate);
    fillStar(tr.children[5].firstChild, stock.symbol, on);
    /* 종목명은 textContent 로 넣는다. 벤더 문자열이라 그대로 HTML 에 붙이지 않는다.
       한글명이 있으면 그것을 앞에 세운다. 없는 종목(대부분 ETF)은 영문명 그대로다 */
    tr.children[1].textContent = stock.nameKo || stock.name;
    if (stock.nameKo) {
      var en = document.createElement("span");
      en.className = "sub";
      en.style.marginLeft = "6px";
      en.textContent = stock.name;
      tr.children[1].appendChild(en);
    }
    return tr;
  }

  function notice(message) {
    var tr = document.createElement("tr");
    tr.innerHTML = '<td colspan="6" class="sub" style="padding:24px;text-align:center"></td>';
    tr.children[0].textContent = message;
    return tr;
  }

  function render() {
    /* 검색 결과에는 거래소 필터를 걸지 않는다.
       그 필터는 아래 "전체 종목" 카드에 붙어 있고, 다른 카드의 조작이 여기까지 미치면
       왜 결과가 줄었는지 알 수 없다. 검색은 친 글자에만 반응한다 */
    var list = last;
    tbody.replaceChildren();
    if (!input.value.trim()) {
      countEl.textContent = "—";
      tbody.appendChild(notice("티커나 종목명을 입력하세요"));
      return;
    }
    countEl.textContent = list.length + "건";
    if (list.length === 0) {
      tbody.appendChild(notice("검색 결과가 없습니다. 미장은 미국 상장 종목만 다룹니다 — "
              + "티커(AAPL)나 영문 종목명으로 검색해보세요. 상장폐지된 종목은 검색에서 제외됩니다."));
      return;
    }
    list.forEach(function (s) { tbody.appendChild(row(s)); });
  }

  async function search() {
    var q = input.value.trim();
    if (!q) { last = []; render(); return; }
    var r = await call("/api/stocks/search?q=" + encodeURIComponent(q));
    if (r.ok) { last = r.data; render(); }
  }

  /* 디바운스. 글자마다 보내면 타자 속도만큼 요청이 나간다 */
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(search, 200);
  });

  var filter = document.getElementById("ex-filter");
  if (filter) {
    filter.addEventListener("mj:change", function (e) {
      exchange = e.detail;
      loadAll(true);        // 전체 목록만 다시 받는다. 검색 결과는 건드리지 않는다
    });
  }

  /* 별표는 위임으로 건다. 행이 계속 새로 그려져 개별로 걸면 빠뜨린다 */
  tbody.addEventListener("click", starHandler);

  async function starHandler(e) {
    var btn = e.target.closest(".star");
    if (!btn) return;
    var symbol = btn.dataset.symbol;
    if (watched.has(symbol)) {
      var removed = await call("/api/watchlists/items/" + watched.get(symbol), { method: "DELETE" });
      if (removed.ok) { watched.delete(symbol); btn.textContent = "☆"; btn.setAttribute("aria-pressed", "false"); }
    } else {
      var added = await call("/api/watchlists/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol: symbol })
      });
      if (added.ok) {
        /* 담은 id 를 알아야 다시 눌렀을 때 뺄 수 있다. 목록을 다시 받는다 */
        await loadWatched();
        btn.textContent = "★";
        btn.setAttribute("aria-pressed", "true");
      }
    }
  }

  /* ── 전체 종목 ────────────────────────────────────────────────────────
     검색어가 없어도 무엇이 있는지 볼 수 있어야 한다.
     13,364 종목을 한 번에 그리면 화면이 멎으므로 스무 건씩 이어 받는다. */
  var PAGE_SIZE = 20;
  var allPage = 0;
  var allDone = false;

  function allRow(stock) {
    var tr = document.createElement("tr");
    var on = watched.has(stock.symbol);
    tr.innerHTML =
      '<td><a></a></td>' +
      '<td class="txt"></td>' +
      '<td></td>' +
      '<td></td>' +
      '<td class="r"><button class="star" type="button" aria-label="관심 종목"></button></td>';
    fillSymbolCell(tr.children[0], stock);
    tr.children[2].textContent = stock.exchange || "—";
    tr.children[3].textContent = stock.assetClass === "ETF" ? "ETF" : "개별주";
    fillStar(tr.children[4].firstChild, stock.symbol, on);
    /* 종목명은 textContent 로 넣는다. 벤더 문자열이라 그대로 HTML 에 붙이지 않는다.
       한글명이 있으면 그것을 앞에 세운다 */
    tr.children[1].textContent = stock.nameKo || stock.name;
    if (stock.nameKo) {
      var en = document.createElement("span");
      en.className = "sub";
      en.style.marginLeft = "6px";
      en.textContent = stock.name;
      tr.children[1].appendChild(en);
    }
    return tr;
  }

  /**
   * 다음 묶음을 이어 받는다.
   *
   * <p>이미 그린 것은 지우지 않고 아래에 덧붙인다. 다시 그리면 스크롤 위치가 튄다.
   *
   * @param reset 필터가 바뀌었을 때. 처음부터 다시 받는다
   */
  async function loadAll(reset) {
    var rows = document.getElementById("all-rows");
    var more = document.getElementById("all-more");
    if (!rows || !more) return;

    if (reset) {
      allPage = 0;
      allDone = false;
      rows.replaceChildren();
    }
    if (allDone) return;

    more.disabled = true;
    more.textContent = "불러오는 중…";

    var query = "page=" + allPage + "&size=" + PAGE_SIZE;
    /* 위 필터를 그대로 쓴다. 검색 결과와 전체 목록이 서로 다른 조건을 보면 헷갈린다 */
    if (exchange === "ETF") query += "&assetClass=ETF";
    else if (exchange !== "ALL") query += "&exchange=" + encodeURIComponent(exchange);

    var r = await call("/api/stocks?" + query);
    more.disabled = false;
    more.textContent = "더보기";
    if (!r.ok || !r.data) return;

    var page = r.data;
    page.content.forEach(function (stock) { rows.appendChild(allRow(stock)); });

    var count = document.getElementById("all-count");
    if (count) {
      count.textContent = rows.children.length.toLocaleString("ko-KR")
          + " / " + page.totalElements.toLocaleString("ko-KR") + "종목";
    }

    allPage += 1;
    allDone = !page.hasNext;
    /* 다 받았으면 버튼을 감춘다. 남겨 두면 눌러도 아무 일이 없어 고장으로 읽힌다 */
    more.parentElement.hidden = allDone;
  }

  var moreBtn = document.getElementById("all-more");
  if (moreBtn) moreBtn.addEventListener("click", function () { loadAll(false); });

  /* 전체 목록의 별표도 같은 손잡이를 쓴다 */
  var allRows = document.getElementById("all-rows");
  if (allRows) allRows.addEventListener("click", starHandler);

  /* 최근 검색은 브라우저에 남긴다. 서버에 둘 만한 값이 아니고,
     기기마다 다른 편이 오히려 자연스럽다.

     다만 키는 계정마다 갈라야 한다. 한 키에 몰아 두면 공용 PC 에서 로그아웃한
     앞사람의 검색 기록이 다음 사람 화면에 그대로 뜬다. 기기가 달라 안 보이는 것과
     계정이 달라 안 보이는 것은 다른 문제다.

     사용자 id 는 헤더(header.js)가 /api/users/me 를 받아 알려 준다. 그 응답이
     오기 전에는 아직 누구인지 모르므로, 도착하면 다시 그린다. */
  var RECENT_MAX = 6;
  var recentUser = document.documentElement.dataset.userId || "";

  function recentKey() {
    return "mijang.recent." + (recentUser || "guest");
  }

  function readRecent() {
    try { return JSON.parse(localStorage.getItem(recentKey())) || []; }
    catch (e) { return []; }
  }

  /* 계정을 가르기 전에 쓰던 공용 키. 옮기지 않고 지운다 —
     누구 것인지 알 수 없는 목록을 먼저 로그인한 사람에게 물려줄 수는 없다 */
  try { localStorage.removeItem("mijang.recent"); } catch (e) { /* 막혀 있어도 그만이다 */ }

  document.addEventListener("mijang:user-change", function (e) {
    var id = e.detail || "";
    if (id === recentUser) return;
    recentUser = id;
    drawRecent();
  });

  function drawRecent() {
    var box = document.getElementById("recent");
    if (!box) return;
    var list = readRecent();
    box.hidden = list.length === 0;
    box.replaceChildren();
    var label = document.createElement("span");
    label.className = "k";
    label.textContent = "최근 검색";
    box.appendChild(label);
    list.forEach(function (sym) {
      var a = document.createElement("a");
      a.href = "/stock?symbol=" + encodeURIComponent(sym);
      a.textContent = sym;
      box.appendChild(a);
    });
  }

  /* 고른 종목만 남긴다. 친 글자를 전부 남기면 "AA", "AAP", "AAPL" 이 줄줄이 쌓인다 */
  function remember(symbol) {
    var list = readRecent().filter(function (s) { return s !== symbol; });
    list.unshift(symbol);
    try { localStorage.setItem(recentKey(), JSON.stringify(list.slice(0, RECENT_MAX))); }
    catch (e) { /* 저장 공간이 막혀 있어도 검색 자체는 되어야 한다 */ }
    drawRecent();
  }

  tbody.addEventListener("click", function (e) {
    var link = e.target.closest("a[href^='/stock?symbol=']");
    if (link) remember(decodeURIComponent(link.href.split("symbol=")[1]));
  });

  drawRecent();
  loadWatched().then(function () { render(); loadAll(true); });
})();
</script>
</body>
</html>
