<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미장 — 비밀번호 찾기</title>
<link rel="icon" th:href="@{/img/favicon.png}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/tokens.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth">
  <div>
    <div class="auth-card">
      <p class="logo"><img class="logo-mark" th:src="@{/img/logo.png}" alt=""><small>MIJANG</small></p>
      <h1 style="margin:10px 0 6px;font-size:var(--fs-card)">비밀번호 찾기</h1>
      <p class="note">가입한 이메일로 재설정 링크를 보내드립니다</p>

      <form onsubmit="alert('재설정 링크를 보냈습니다');return false">
        <div class="field">
          <label for="f-email">이메일</label>
          <input id="f-email" type="email" value="demo@mijang.app">
        </div>
        <button class="btn btn-primary btn-block" type="submit">재설정 링크 받기</button>
        <p class="info">소셜 계정으로만 가입한 경우 비밀번호 재설정 대상이 아닙니다. 소셜 로그인을 이용해주세요.</p>
      </form>

      <p class="auth-foot"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
    </div>
    <p class="auth-note">가입되지 않은 이메일은 발송 완료로 표시하지 않고 오류를 안내합니다</p>
  </div>
</div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
