<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미장 — 비밀번호 찾기</title>
  <link rel="icon" th:href="@{/img/favicon.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth">
  <div>
    <div class="auth-card">
      <p class="logo"><img class="logo-mark" th:src="@{/img/logo.png}" alt=""><small>MIJANG</small></p>
      <p class="note">가입한 이메일로 재설정 링크를 보내드립니다</p>

      <form id="forgot-form" th:attr="data-cooldown=${resendCooldownSeconds}">
        <div class="field">
          <label for="f-email">이메일</label>
          <input id="f-email" name="email" type="email" autocomplete="email" placeholder="이메일" required>
        </div>
        <!-- 성공·실패 모두 같은 문구가 여기 붙는다 -->
        <p class="msg" id="forgot-msg" hidden></p>
        <button class="btn btn-primary btn-block" id="forgot-submit" type="submit">재설정 링크 받기</button>
      </form>

      <p class="auth-foot">비밀번호가 기억나셨나요? <a th:href="@{/login}">로그인</a></p>
    </div>
  </div>
</div>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/ui.js}"></script>
<script th:attr="nonce=${cspNonce}">
/* 재설정 링크 요청.
   가입된 주소인지 알려 주지 않는다. 서버가 언제나 같은 응답을 주므로
   화면도 결과와 무관하게 같은 문구를 띄운다. */
(function () {
  var form = document.getElementById("forgot-form");
  var msg  = document.getElementById("forgot-msg");
  var btn  = document.getElementById("forgot-submit");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true;
    try {
      var res = await fetch("/api/auth/password/forgot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("f-email").value })
      });
      /* 응답 내용을 보지 않는다. 400(형식 오류)이든 200이든 같은 문구다 —
         여기서 갈라 놓으면 가입 여부가 아니라 입력 형식이 드러나는 데 그치지만,
         굳이 다르게 말할 이유도 없다.

         429 만 예외다. 쓰로틀은 가입 여부를 보기 전에 세므로(AuthController)
         "제한에 걸렸다" 가 가입 여부를 알려 주지 않는다. 반대로 이걸 감추면
         아무리 눌러도 소식이 없는 화면이 된다 */
      if (res.status === 429) {
        msg.className = "msg err";
        msg.textContent = "요청이 너무 잦습니다. 잠시 후 다시 시도해주세요";
        msg.hidden = false;
        btn.disabled = false;
        return;
      }
      msg.className = "msg ok";
      msg.textContent = "가입된 이메일이라면 재설정 링크를 보냈습니다. 메일함을 확인해주세요";
      msg.hidden = false;
      startCooldown();
      return;
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요";
    }
    msg.hidden = false;
    btn.disabled = false;
  });

  /*
   * 다시 누를 수 있을 때까지 남은 시간을 버튼에 적는다.
   *
   * 서버는 같은 간격 안에 다시 요청하면 메일을 보내지 않고 조용히 넘어간다. 그 사실을
   * 응답으로 알려 줄 수는 없다 — 그 간격은 가입된 계정에만 걸려서, 알려 주는 순간
   * 이 화면이 계정 조회 도구가 된다.
   *
   * 그래서 화면이 자기가 방금 보냈다는 것만 가지고 센다. 서버에 묻지 않으니 아무것도
   * 새지 않고, 사용자는 "왜 다시 보내도 안 오지" 를 겪지 않는다.
   */
  function startCooldown() {
    var left = Number(form.dataset.cooldown) || 0;
    if (left <= 0) { btn.disabled = false; return; }

    var label = btn.textContent;
    btn.disabled = true;
    tick();

    function tick() {
      btn.textContent = "다시 보내기 (" + left + "초)";
      if (left <= 0) {
        btn.textContent = label;
        btn.disabled = false;
        return;
      }
      left -= 1;
      setTimeout(tick, 1000);
    }
  }
})();
</script>
</body>
</html>
