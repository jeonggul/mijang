<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미장 — 비밀번호 재설정</title>
  <link rel="icon" th:href="@{/img/favicon.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth">
  <div>
    <div class="auth-card">
      <p class="logo"><img class="logo-mark" th:src="@{/img/logo.png}" alt=""><small>MIJANG</small></p>
      <!-- 링크가 만료됐거나 이미 쓴 경우. 입력 화면 대신 안내만 보여준다 -->
      <div th:if="${invalid}">
        <p class="msg err" th:text="${errorMessage}">재설정 링크가 만료되었거나 이미 사용되었습니다</p>
        <p class="auth-note" style="margin-top:14px">다시 요청하시면 새 링크를 보내드립니다.</p>
        <a class="btn btn-primary btn-block" style="margin-top:16px" th:href="@{/password-forgot}">재설정 링크 다시 받기</a>
      </div>

      <p class="note" th:unless="${invalid}">새 비밀번호를 입력해주세요</p>

      <form id="reset-form" th:unless="${invalid}">
        <div class="field">
          <label for="r-pw">새 비밀번호</label>
          <input type="hidden" id="r-token" th:value="${token}">
          <input id="r-pw" name="password" type="password" autocomplete="new-password"
                 placeholder="영문과 숫자를 모두 포함해 8~16자" required>
          <p class="hint">닉네임이나 이메일 아이디가 들어간 비밀번호는 사용할 수 없습니다</p>
        </div>
        <div class="field">
          <label for="r-pw2">새 비밀번호 확인</label>
          <input id="r-pw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력" required>
        </div>
        <p class="msg err" id="reset-msg" hidden></p>
        <button class="btn btn-primary btn-block" id="reset-submit" type="submit">비밀번호 변경</button>
      </form>

      <p class="auth-foot"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
    </div>
    <p class="auth-note" th:text="|링크는 ${resetMinutes}분 동안만 쓸 수 있습니다|">링크는 30분 동안만 쓸 수 있습니다</p>
  </div>
</div>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/ui.js}"></script>
<script th:attr="nonce=${cspNonce}">
/* 새 비밀번호 저장.
   토큰은 메일 링크의 쿼리스트링에 있다. 화면은 그대로 실어 보내기만 한다. */
(function () {
  var form = document.getElementById("reset-form");
  if (!form) return;
  var pw   = document.getElementById("r-pw");
  var pw2  = document.getElementById("r-pw2");
  var msg  = document.getElementById("reset-msg");
  var btn  = document.getElementById("reset-submit");
  /* 서버가 이미 유효성을 확인하고 넘겨준 값이다. 화면이 주소를 다시 파싱하지 않는다 */
  var token = document.getElementById("r-token") ? document.getElementById("r-token").value : null;

  /* 무효한 링크면 서버가 폼 자체를 그리지 않는다. 붙을 곳이 없으면 조용히 끝낸다 */
  if (!form || !token) return;

  function show(text) { msg.textContent = text; msg.hidden = false; pw.setAttribute("aria-invalid", "true"); }
  form.addEventListener("input", function () {
    /* 토큰이 없어 띄운 안내는 지우지 않는다. 지우면 이유도 없이 눌리지 않는 버튼만 남는다 */
    if (!token) return;
    msg.hidden = true;
    pw.removeAttribute("aria-invalid");
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    /* 두 값이 다른 것은 서버에 물어볼 필요가 없다 */
    if (pw.value !== pw2.value) { show("두 비밀번호가 서로 다릅니다"); return; }

    btn.disabled = true;
    var body;
    try {
      var res = await fetch("/api/auth/password/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, password: pw.value })
      });
      body = await res.json();
    } catch (err) {
      show("서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요");
      btn.disabled = false;
      return;
    }
    if (body.success) { location.href = "/login"; return; }
    show(body.error ? body.error.message : "비밀번호를 바꾸지 못했습니다");
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
