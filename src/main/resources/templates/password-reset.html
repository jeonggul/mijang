<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미장 — 비밀번호 재설정</title>
<link rel="icon" th:href="@{/img/favicon.png}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/tokens.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth">
  <div>
    <div class="auth-card">
      <p class="logo"><img class="logo-mark" th:src="@{/img/logo.png}" alt=""><small>MIJANG</small></p>
      <h1 style="margin:10px 0 6px;font-size:var(--fs-card)">새 비밀번호 설정</h1>
      <p class="note">링크는 발급 후 30분간 유효합니다</p>

      <form onsubmit="location.href='/login';return false">
        <div class="field">
          <label for="r-pw">새 비밀번호</label>
          <input id="r-pw" type="password" value="password12">
          <p class="hint">영문·숫자 포함 8자 이상</p>
        </div>
        <div class="field">
          <label for="r-pw2">새 비밀번호 확인</label>
          <input id="r-pw2" type="password" value="password1">
          <p class="hint err">비밀번호가 일치하지 않습니다</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit">비밀번호 변경</button>
      </form>

      <p class="auth-foot"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
    </div>
    <p class="auth-note">변경 후 모든 기기에서 로그아웃됩니다</p>
  </div>
</div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
