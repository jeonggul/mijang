<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미장 — 매매 기록</title>
<link rel="icon" th:href="@{/img/favicon.png}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/tokens.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/header :: siteHeader}"></header>

<div class="layout no-panel">

  <aside class="card sidebar">
    <button class="switcher" type="button">
      전체 포트폴리오<span class="spacer"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 주가손익·환차손익 분해는 PROFIT-03 이고 dashboard 범위다. 자리만 두고 비워 둔다 -->
    <ul class="stat-list">
      <li><span class="k">종목 수</span><span class="v num" id="rl-count">—</span></li>
      <li><span class="k">주가손익</span><span class="v num">—</span></li>
      <li><span class="k">환차손익</span><span class="v num">—</span></li>
    </ul>

    <p class="nav-label">보유 종목</p>
    <ul class="holdings-nav" id="rl-nav"><!-- 스크립트가 채운다 --></ul>

    <a class="btn-record" th:href="@{/record-new}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      매매 기록 추가
    </a>
  </aside>

  <main>
    <div class="page-head">
      <div><h1>매매 기록</h1><p>입력한 기록의 원장입니다 · 수정하면 보유 현황이 재계산됩니다</p></div>
      <span class="grow"></span>
      <button class="btn btn-sm" type="button">CSV 내보내기</button>
      <a class="btn btn-primary btn-sm" th:href="@{/record-new}">＋ 기록 추가</a>
    </div>

    <div class="row-between" style="margin-bottom:14px">
      <!-- data-side-filter · data-period 는 스크립트가 두 그룹을 구분하는 표식이다 -->
      <div class="pills" data-toggle-group data-side-filter>
        <button type="button" data-value="ALL" aria-pressed="true">전체</button>
        <button type="button" data-value="BUY" aria-pressed="false">매수</button>
        <button type="button" data-value="SELL" aria-pressed="false">매도</button>
      </div>
      <!-- 종목 필터는 서버가 건다(?symbol=). 매수/매도·기간과 달리 티커는 개수가 정해져 있지 않아
           pill 로 늘어놓을 수 없고, 페이지 밖의 기록까지 찾아야 해서 화면에서 거르면 안 된다 -->
      <label class="sr-only" for="tx-symbol">종목</label>
      <select id="tx-symbol" style="margin-left:12px">
        <option value="">전체 종목</option>
      </select>
      <span class="sub num" id="tx-count" style="margin-left:12px">—</span>
      <span class="spacer" style="flex:1"></span>
      <!-- 연도는 스크립트가 올해로 채운다. 화면에 연도를 박아 두면 해가 바뀔 때 조용히 틀려진다.
           기본값은 "전체 기간" 이다 — 기본이 연도 필터면 지난해 기록이 사라진 것처럼 보인다 -->
      <div class="pills" data-toggle-group data-period>
        <button type="button" data-value="YEAR" aria-pressed="false" id="tx-year">올해</button>
        <button type="button" data-value="ALL" aria-pressed="true">전체 기간</button>
      </div>
    </div>

      <div id="tx-cards"><!-- 스크립트가 채운다 --></div>

      <nav class="pager" id="tx-pager" style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px" hidden>
        <button class="btn btn-sm" type="button" id="tx-prev">이전</button>
        <span class="sub num" id="tx-page">1 / 1</span>
        <button class="btn btn-sm" type="button" id="tx-next">다음</button>
      </nav>


    <p class="note" style="text-align:center;margin-top:16px">
      기록을 수정하거나 삭제하면 보유 현황과 과거 스냅샷이 다시 계산됩니다
    </p>
  </main>
</div>
<!-- SR-006-2 기록 삭제 확인. 브라우저 confirm 은 무엇을 지우는지 못 보여준다 —
     어느 기록인지와 판단 메모가 함께 사라진다는 사실을 짚어야 한다 -->
<div class="overlay" id="del-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dm-t">
    <h2 id="dm-t">이 기록을 삭제할까요?</h2>
    <p id="dm-what">—</p>
    <ul class="kv">
      <li><span class="k">수량 · 단가</span><span class="v num" id="dm-qty">—</span></li>
      <li><span class="k">적용 환율</span><span class="v num" id="dm-fx">—</span></li>
    </ul>
    <p class="prev-group" id="dm-memo-head" hidden>함께 삭제되는 판단 메모</p>
    <p class="note" id="dm-memo" hidden></p>
    <p class="note">삭제하면 보유 현황과 평균 단가가 다시 계산됩니다.</p>
    <p class="form-error" id="dm-error" role="alert" hidden></p>
    <div class="modal-actions">
      <button class="btn" type="button" data-close>취소</button>
      <button class="btn btn-danger" type="button" id="dm-confirm">삭제</button>
    </div>
  </div>
</div>

<script th:attr="nonce=${cspNonce}" th:src="@{/js/ui.js}"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/header-search.js}" defer></script>
<script th:attr="nonce=${cspNonce}">
/* 매매 기록 목록 (ACCOUNT-06) · 삭제 (2.9)
   프로토타입이 표가 아니라 카드라 카드로 그린다. 판단 메모가 한 줄로 들어가야 해서
   표보다 카드가 맞다 — 이 서비스의 차별점이 그 메모다.

   페이징은 서버가 하고, 매수/매도·기간 필터는 받아 온 한 페이지 안에서 거른다.
   그래서 필터를 켜면 "표시 M건 / 전체 N건" 으로 무엇을 세고 있는지 밝힌다. */
(function () {
  var box = document.getElementById("tx-cards");
  if (!box) return;

  var SIZE = 20;
  var page = 0;
  var totalPages = 1;
  var totalElements = 0;
  var side = "ALL";
  var period = "ALL";
  var symbol = "";          /* 종목 필터. 서버가 건다 */
  var loaded = {};          /* 이번 페이지의 기록. 삭제 확인 모달이 내용을 꺼내 쓴다 */
  var year = new Date().getFullYear();

  var yearBtn = document.getElementById("tx-year");
  if (yearBtn) yearBtn.textContent = year + "년";

  function money(v, digits) {
    return v == null ? "—" : Number(v).toLocaleString("ko-KR",
      { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  /* 수량은 자리수를 고정하지 않는다. 소수점 매수를 1자리로 반올림하면 0.526316주가
     0.5주로 보여 거짓말이 된다. 정수 주는 "3주" 로, 소수는 있는 만큼 보여준다 */
  function shares(v) {
    return v == null ? "—" : Number(v).toLocaleString("ko-KR",
      { minimumFractionDigits: 0, maximumFractionDigits: 6 });
  }

  /* 원화 환산 — 서버는 체결 금액을 따로 주지 않는다. 수량·단가·환율이 다 있으므로 여기서 곱한다.
     수수료는 뺀 체결 금액 기준이다(Transaction.amountUsd 와 같은 정의). 수수료는 옆 칸에 따로 있다 */
  function amountKrw(tx) {
    if (tx.quantity == null || tx.price == null || tx.fxRate == null) return null;
    return Number(tx.quantity) * Number(tx.price) * Number(tx.fxRate);
  }

  var SENTIMENT = { CONFIDENT: "확신", NEUTRAL: "중립", ANXIOUS: "불안", FOMO: "조급" };

  function card(tx) {
    var buy = tx.side === "BUY";
    var art = document.createElement("article");
    art.className = "record-card";
    art.dataset.side = tx.side;
    art.dataset.year = (tx.tradeDate || "").slice(0, 4);

    /* 뼈대만 세우고 값은 textContent 로 넣는다. 종목명·사유는 사용자와 벤더가 준 글자다 */
    art.innerHTML =
      '<header>' +
        '<span class="badge"></span>' +
        '<b class="tk"></b><span class="nm"></span>' +
        '<time class="date"></time>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" type="button">삭제</button>' +
      '</header>' +
      '<dl class="figures">' +
        '<div><dt>수량</dt><dd class="num"></dd></div>' +
        '<div><dt>단가</dt><dd class="num"></dd></div>' +
        '<div><dt>적용 환율</dt><dd class="num"></dd></div>' +
        '<div><dt>수수료</dt><dd class="num"></dd></div>' +
        '<div><dt>원화 환산</dt><dd class="num"></dd></div>' +
      '</dl>';

    var badge = art.querySelector(".badge");
    badge.className = "badge " + (buy ? "badge-rise" : "badge-fall");
    badge.textContent = buy ? "매수" : "매도";

    /* 매도는 실현손익을 함께 보여준다(SR-007). 서버가 그 시점 평단가로 계산해서 준다 —
       거래 한 줄만 보고는 구할 수 없는 값이라 화면에서 만들지 않는다 */
    if (!buy && tx.realizedPnlKrw != null) {
      var r = Number(tx.realizedPnlKrw);
      var rb = document.createElement("span");
      rb.className = "badge " + (r >= 0 ? "badge-rise" : "badge-fall");
      rb.textContent = "실현 " + (r >= 0 ? "+" : "−") +
        Math.abs(Math.round(r)).toLocaleString("ko-KR") + "원";
      badge.after(rb);
    }
    art.querySelector(".tk").textContent = tx.symbol;
    art.querySelector(".nm").textContent = tx.name || "";
    var t = art.querySelector("time");
    t.dateTime = tx.tradeDate;
    t.textContent = tx.tradeDate;
    art.querySelector("button").dataset.txId = tx.id;

    var dd = art.querySelectorAll("dd");
    dd[0].textContent = shares(tx.quantity) + "주";
    dd[1].textContent = "$" + money(tx.price, 2);
    dd[2].textContent = money(tx.fxRate, 2) + "원";
    dd[3].textContent = "$" + money(tx.fee, 2);
    var krw = amountKrw(tx);
    dd[4].textContent = krw == null ? "—" : money(krw, 0) + "원";

    /* 판단 메모는 있을 때만 붙인다. 없는 자리를 빈 칸으로 남기면 지저분하다 */
    if (tx.buyReason || tx.targetPrice != null || tx.sentiment) {
      var memo = document.createElement("p");
      memo.className = "memo";
      var k = document.createElement("span");
      k.className = "why";
      k.textContent = tx.buyReason || "";
      memo.appendChild(k);
      if (tx.targetPrice != null) {
        var tg = document.createElement("span");
        tg.className = "badge badge-line";
        tg.textContent = "목표 $" + money(tx.targetPrice, 2);
        memo.appendChild(tg);
      }
      if (tx.sentiment) {
        var st = document.createElement("span");
        st.className = "badge";
        st.textContent = SENTIMENT[tx.sentiment] || tx.sentiment;
        memo.appendChild(st);
      }
      art.appendChild(memo);
    }
    return art;
  }

  function empty(message) {
    var p = document.createElement("p");
    p.className = "note";
    p.style.padding = "24px";
    p.style.textAlign = "center";
    p.textContent = message;
    return p;
  }

  /* 필터는 이 페이지 안에서만 건다. 서버 요청은 그대로다 */
  function applyFilter() {
    var shown = 0;
    Array.prototype.forEach.call(box.children, function (el) {
      if (!el.classList || !el.classList.contains("record-card")) return;
      var okSide = side === "ALL" || el.dataset.side === side;
      var okYear = period === "ALL" || el.dataset.year === String(year);
      el.hidden = !(okSide && okYear);
      if (!el.hidden) shown++;
    });

    var count = document.getElementById("tx-count");
    if (count) {
      /* 종목은 서버가 걸러 totalElements 에 이미 반영돼 있다. 화면에서 더 거르는
         매수매도·기간일 때만 "표시 M / 전체 N" 으로 나눈다 */
      var filtering = side !== "ALL" || period !== "ALL";
      count.textContent = filtering
        ? "표시 " + shown + "건 / 전체 " + totalElements + "건"
        : totalElements + "건";
    }
    return shown;
  }

  function renderPager() {
    var pager = document.getElementById("tx-pager");
    if (!pager) return;
    pager.hidden = totalPages <= 1;
    document.getElementById("tx-page").textContent = (page + 1) + " / " + totalPages;
    document.getElementById("tx-prev").disabled = page === 0;
    document.getElementById("tx-next").disabled = page >= totalPages - 1;
  }

  async function load() {
    var res = await fetch("/api/transactions?page=" + page + "&size=" + SIZE +
                          (symbol ? "&symbol=" + encodeURIComponent(symbol) : ""));
    if (res.status === 401) { location.href = "/login"; return; }
    var out = await res.json();
    box.replaceChildren();
    loaded = {};

    if (!out.success) {
      box.appendChild(empty("불러오지 못했습니다"));
      totalElements = 0; totalPages = 1;
      renderPager();
      applyFilter();
      return;
    }

    var data = out.data || {};
    var rows = data.content || [];
    totalElements = data.totalElements == null ? rows.length : data.totalElements;
    totalPages = Math.max(1, data.totalPages == null
      ? Math.ceil(totalElements / SIZE) : data.totalPages);

    if (rows.length === 0) {
      box.appendChild(empty("아직 기록이 없습니다. 첫 매매를 남겨보세요."));
      renderPager();
      applyFilter();
      return;
    }

    loaded = {};
    rows.forEach(function (tx) {
      loaded[tx.id] = tx;
      box.appendChild(card(tx));
    });
    renderPager();
    if (applyFilter() === 0) {
      box.appendChild(empty("이 조건에 맞는 기록이 이 페이지에 없습니다."));
    }
  }

  /* 지운 뒤 보유 현황이 다시 계산된다(2.2). 목록만 새로 그리면 된다 */
  /* SR-006-2 삭제 확인. 브라우저 confirm 은 무엇을 지우는지 못 보여준다 —
     특히 판단 메모가 함께 사라진다는 사실이 전달되지 않는다 */
  var modal = document.getElementById("del-modal");
  var pending = null;

  function askDelete(tx) {
    pending = tx;
    document.getElementById("dm-what").textContent =
      tx.symbol + " " + (tx.side === "BUY" ? "매수" : "매도") + " · " + tx.tradeDate + " 기록입니다.";
    document.getElementById("dm-qty").textContent =
      shares(tx.quantity) + "주 · $" + money(tx.price, 2);
    document.getElementById("dm-fx").textContent = money(tx.fxRate, 2) + "원";

    var head = document.getElementById("dm-memo-head");
    var memo = document.getElementById("dm-memo");
    var hasMemo = !!(tx.buyReason || tx.targetPrice != null || tx.sentiment);
    head.hidden = !hasMemo;
    memo.hidden = !hasMemo;
    if (hasMemo) {
      memo.textContent = (tx.buyReason || "적어둔 사유 없음") +
        " — 회고에서 더 이상 볼 수 없습니다.";
    }
    document.getElementById("dm-error").hidden = true;
    document.getElementById("dm-confirm").disabled = false;
    modal.hidden = false;
  }

  box.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-tx-id]");
    if (!btn) return;
    var tx = loaded[btn.dataset.txId];
    if (tx) askDelete(tx);
  });

  document.getElementById("dm-confirm").addEventListener("click", async function () {
    if (!pending) return;
    var confirmBtn = document.getElementById("dm-confirm");
    var error = document.getElementById("dm-error");
    error.hidden = true;
    confirmBtn.disabled = true;

    var res = await fetch("/api/transactions/" + pending.id, { method: "DELETE" });
    if (res.status === 401) { location.href = "/login"; return; }

    /* 서버가 거절할 수 있다. 그 매수를 지우면 뒤따르는 매도가 보유량을 넘기는 경우가 그렇다(2.5).
       모달을 그냥 닫으면 아무 일도 없었던 것처럼 보이고, 사용자는 왜 안 지워졌는지 모른다 */
    var out = await res.json();
    if (!out.success) {
      error.textContent = out.error ? out.error.message : "삭제하지 못했습니다";
      error.hidden = false;
      confirmBtn.disabled = false;
      return;
    }

    modal.hidden = true;
    /* 그 페이지의 마지막 한 건을 지웠으면 빈 페이지가 남으므로 한 장 앞으로 물러난다 */
    if (page > 0 && box.querySelectorAll(".record-card").length === 1) page--;
    pending = null;
    load();
  });

  var prev = document.getElementById("tx-prev");
  if (prev) prev.addEventListener("click", function () {
    if (page > 0) { page--; load(); }
  });
  var next = document.getElementById("tx-next");
  if (next) next.addEventListener("click", function () {
    if (page < totalPages - 1) { page++; load(); }
  });

  /* 종목 목록은 거래한 적 있는 티커 전부다. 보유 목록으로 대신할 수 없다 —
     전량 매도한 종목의 기록도 찾을 수 있어야 한다 */
  var symbolSelect = document.getElementById("tx-symbol");
  if (symbolSelect) {
    symbolSelect.addEventListener("change", function () {
      symbol = symbolSelect.value;
      page = 0;                 // 종목을 바꾸면 건수가 달라진다. 첫 장부터 본다
      load();
    });

    (async function () {
      var res = await fetch("/api/transactions/symbols");
      if (!res.ok) return;
      var out = await res.json();
      if (!out.success) return;
      (out.data || []).forEach(function (sym) {
        var opt = document.createElement("option");
        opt.value = sym;
        opt.textContent = sym;
        symbolSelect.appendChild(opt);
      });
    })();
  }

  var sideGroup = document.querySelector("[data-side-filter]");
  if (sideGroup) sideGroup.addEventListener("mj:change", function (e) {
    side = e.detail;
    redrawFilter();
  });
  var periodGroup = document.querySelector("[data-period]");
  if (periodGroup) periodGroup.addEventListener("mj:change", function (e) {
    period = e.detail === "YEAR" ? "YEAR" : "ALL";
    redrawFilter();
  });

  /* 필터를 다시 걸 때 "조건에 맞는 기록 없음" 안내가 쌓이지 않게 먼저 걷어낸다 */
  function redrawFilter() {
    Array.prototype.slice.call(box.querySelectorAll(".note")).forEach(function (n) {
      n.remove();
    });
    if (box.querySelectorAll(".record-card").length === 0) return;
    if (applyFilter() === 0) {
      box.appendChild(empty("이 조건에 맞는 기록이 이 페이지에 없습니다."));
    }
  }

  load();
})();

/* 사이드바 보유 요약. 목록 화면에서도 지금 무엇을 들고 있는지 보이는 편이 낫다 */
(function () {
  var nav = document.getElementById("rl-nav");
  if (!nav) return;

  (async function () {
    var res = await fetch("/api/portfolio/holdings");
    if (!res.ok) return;
    var out = await res.json();
    if (!out.success) return;

    var held = (out.data || []).filter(function (h) { return Number(h.quantity) > 0; });
    var count = document.getElementById("rl-count");
    if (count) count.textContent = String(held.length);

    nav.replaceChildren();
    held.forEach(function (h) {
      var cost = (h.avgPrice == null || h.avgFxRate == null) ? null
        : Number(h.quantity) * Number(h.avgPrice) * Number(h.avgFxRate);
      var r = (h.evalPnlKrw == null || !cost) ? null : (Number(h.evalPnlKrw) / cost) * 100;

      var li = document.createElement("li");
      var a = document.createElement("a");
      a.setAttribute("href", "/stock?symbol=" + encodeURIComponent(h.symbol));
      var tk = document.createElement("span");
      tk.className = "tk";
      tk.textContent = h.symbol;
      var pc = document.createElement("span");
      pc.className = "pc" + (r == null ? "" : (r >= 0 ? " rise" : " fall"));
      pc.textContent = r == null ? "—" : (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(1) + "%";
      a.appendChild(tk); a.appendChild(pc);
      li.appendChild(a);
      nav.appendChild(li);
    });
  })();
})();
</script>

</body>
</html>
