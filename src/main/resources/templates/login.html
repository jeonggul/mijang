<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미장 — 로그인</title>
  <link rel="icon" th:href="@{/img/favicon.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth">
  <div>
    <div class="auth-card">
      <p class="logo"><img class="logo-mark" th:src="@{/img/logo.png}" alt=""><small>MIJANG</small></p>

      <!-- 계정 안내. 설정에 목록이 없으면 이 블록 자체가 렌더되지 않는다 —
           운영에 그대로 올라가도 설정을 채우지 않는 한 아무것도 새지 않는다 -->
      <div class="menu-anchor demo-anchor" th:if="${!#lists.isEmpty(demoAccounts)}">
        <button class="demo-tip-btn" type="button" data-open="demo-tip"
                aria-label="계정 안내 열기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7.8" r="1.1" fill="currentColor"/>
          </svg>
          계정 안내
        </button>

        <div class="dropdown demo-tip" id="demo-tip" hidden role="dialog" aria-label="계정 안내">
          <p class="demo-tip-head">눌러서 입력칸에 채웁니다</p>

          <!-- 값은 th:text·th:attr 로 넣는다. 서버가 준 문자열이라 그대로 HTML 에 붙이지 않는다 -->
          <div class="demo-item" th:each="acc : ${demoAccounts}">
            <button class="demo-row" type="button" data-fill="email"
                    th:attr="data-value=${acc.email}">
              <span class="k">이메일</span><span class="v" th:text="${acc.email}">—</span>
            </button>
            <!-- 비밀번호를 설정에 두지 않은 계정은 이 줄이 없다. 직접 친다 -->
            <button class="demo-row" type="button" data-fill="pw"
                    th:if="${acc.hasPassword()}" th:attr="data-value=${acc.password}">
              <span class="k">비밀번호</span><span class="v" th:text="${acc.password}">—</span>
            </button>
            <p class="demo-hint" th:unless="${acc.hasPassword()}">비밀번호는 직접 입력합니다</p>
            <button class="btn btn-sm btn-block demo-go" type="button"
                    th:attr="data-email=${acc.email},data-password=${acc.password}">채우기</button>
          </div>

          <p class="demo-tip-foot">둘러보기용 안내입니다. 실제 매매와 무관합니다.</p>
        </div>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="이메일" required>
          <!-- 로그인 실패 문구는 여기에 붙는다. 폼 위에 경고 박스를 따로 두지 않는다 -->
          <p class="msg err" id="login-msg" hidden></p>
        </div>
        <div class="field">
          <label for="pw">비밀번호</label>
          <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label class="check" style="flex:1"><input id="remember" type="checkbox" checked>로그인 상태 유지</label>
          <a th:href="@{/password-forgot}" style="font-size:var(--fs-label);color:var(--record);font-weight:600">비밀번호 찾기</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
        <p class="divider">또는</p>

        <!-- 원 안에 각 제공자 로고. 이름을 적지 않아도 로고로 알아본다.
             a 태그인 이유 — 소셜 로그인은 제공자로 넘어가는 화면 이동이라
             fetch 로 부를 수 없다. Spring 이 /oauth2/authorization/{id} 를 받는다 -->
        <div class="social-row">
          <a class="social-btn google" th:href="@{/oauth2/authorization/google}"
             aria-label="구글로 계속하기" title="구글로 계속하기">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.3h12.1c-.2 1.9-1.6 4.8-4.5 6.7l-.1.3 6.5 5 .5.1c4.1-3.8 6.6-9.4 6.6-15.4"/>
              <path fill="#34A853" d="M24 46c5.9 0 10.9-1.9 14.5-5.3l-6.9-5.4c-1.9 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-.3 0-6.8 5.2-.1.3C7.9 41 15.4 46 24 46"/>
              <path fill="#FBBC05" d="M11.5 28.4c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4l0-.3-6.9-5.3-.2.1C2.9 17 2 20.4 2 24s.9 7 2.4 10l7.1-5.6"/>
              <path fill="#EA4335" d="M24 9.5c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 3.4 29.9 1 24 1 15.4 1 7.9 6 4.4 14l7.1 5.6C13.3 14.3 18.2 9.5 24 9.5"/>
            </svg>
          </a>

          <a class="social-btn kakao" th:href="@{/oauth2/authorization/kakao}"
             aria-label="카카오로 계속하기" title="카카오로 계속하기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#191600" d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.9 4.3 6.2l-1.1 4c-.1.3.3.6.6.4l4.8-3.2c.2 0 .4 0 .6 0 5.1 0 9.2-3.3 9.2-7.4S17.1 3 12 3"/>
            </svg>
          </a>
        </div>
        <p class="note" style="text-align:center">소셜 계정으로 바로 시작할 수 있습니다</p>
      </form>

      <p class="auth-foot">아직 계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
    </div>
    <p class="auth-note">미장은 증권사가 아닙니다. 본인 확인이나 인증서 절차가 없습니다.</p>
  </div>
</div>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/ui.js}"></script>
<script th:attr="nonce=${cspNonce}">
/* 로그인 — 성공하면 서버가 HttpOnly 쿠키를 굽고, 그 뒤 화면 이동은 쿠키로 인증된다.
   토큰을 localStorage 에 넣지 않는다. JS 가 읽을 수 있으면 XSS 한 번에 털린다. */
(function () {
  var form  = document.getElementById("login-form");
  var email = document.getElementById("email");
  var msg   = document.getElementById("login-msg");

  /* 실패 문구는 이메일 칸 아래에 띄우고, 그 칸을 오류 상태로 표시한다.
     이메일·비밀번호 중 어느 쪽이 틀렸는지는 서버가 알려 주지 않는다(계정 존재 여부 노출 방지).
     그래서 두 칸 중 위쪽 하나에만 붙인다. */
  function show(text) {
    msg.textContent = text;
    msg.hidden = false;
    email.setAttribute("aria-invalid", "true");
  }
  function clear() {
    msg.hidden = true;
    email.removeAttribute("aria-invalid");
  }
  form.addEventListener("input", clear);

  /* ── 계정 안내 말풍선 ────────────────────────────────────
     아이콘을 누르면 열린다(여닫기는 ui.js 의 data-open 이 맡는다).
     줄을 누르면 그 값을 입력칸에 넣고 클립보드에도 담는다 — 직접 복사해
     다른 곳에 붙이고 싶을 수 있어 둘 다 한다.

     값을 화면 스크립트에 박지 않는다. 서버가 data-* 로 내려준 것만 읽는다.
     설정이 비어 있으면 이 블록 자체가 렌더되지 않아 아래 코드는 그냥 지나간다. */
  var tip = document.getElementById("demo-tip");
  if (tip) {
    var FIELD = { email: "email", pw: "pw" };

    function fill(which, value) {
      var input = document.getElementById(FIELD[which]);
      if (!input || !value) return;
      input.value = value;
      /* 브라우저 자동완성이 걸려 있어도 화면 값과 폼 값이 어긋나지 않게 알린다 */
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    /* 클립보드는 실패할 수 있다(권한·비보안 출처). 실패해도 입력칸은 이미 채워졌으니
       사용자가 할 일은 남지 않는다 — 그래서 조용히 넘어간다 */
    function copy(value) {
      if (!navigator.clipboard || !value) return;
      navigator.clipboard.writeText(value).catch(function () { });
    }

    function flash(el) {
      el.classList.add("copied");
      setTimeout(function () { el.classList.remove("copied"); }, 900);
    }

    tip.addEventListener("click", function (e) {
      var row = e.target.closest("[data-fill]");
      if (row) {
        fill(row.dataset.fill, row.dataset.value);
        copy(row.dataset.value);
        flash(row);
        return;
      }

      var go = e.target.closest(".demo-go");
      if (!go) return;

      fill("email", go.dataset.email);
      fill("pw", go.dataset.password);
      tip.hidden = true;
      /* 비밀번호를 설정에 두지 않은 계정이면 그 칸에 초점을 준다 — 바로 칠 수 있게.
         다 채워졌으면 로그인 버튼으로 보낸다 */
      var next = go.dataset.password
        ? form.querySelector('button[type="submit"]')
        : document.getElementById("pw");
      if (next) next.focus();
    });
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    clear();

    var body;
    try {
      var res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email.value,
          password: document.getElementById("pw").value,
          rememberMe: document.getElementById("remember").checked
        })
      });
      /* 실패도 봉투로 오므로 상태 코드가 아니라 success 를 본다 (미장-API명세서 1.1) */
      body = await res.json();
    } catch (err) {
      /* 잡지 않으면 promise 가 거부된 채 끝나 버튼이 아무 반응 없는 것처럼 보인다 */
      show("서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요");
      return;
    }

    if (body.success) {
      /* 관리자는 관리자 화면으로 바로 보낸다. 대시보드를 한 번 거쳐 다시 이동하면
         쓰지도 않을 보유·시세 조회가 먼저 나간다 */
      var me = body.data && body.data.user;
      location.href = me && me.role === "ADMIN" ? "/admin" : "/dashboard";
      return;
    }
    show(body.error ? body.error.message : "로그인에 실패했습니다");
  });
})();
</script>
</body>
</html>
