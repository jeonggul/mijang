<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미장 — 페이지를 찾을 수 없습니다</title>
<link rel="icon" th:href="@{/img/favicon.png}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/tokens.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth">
  <div class="empty" style="max-width:680px">
    <p class="num" style="font-size:92px;line-height:1;color:var(--text-sub)">404</p>
    <h2>페이지를 찾을 수 없습니다</h2>
    <p>주소가 바뀌었거나 삭제된 종목일 수 있습니다. 상장폐지 종목은 검색에서 제외됩니다.</p>
    <div class="cta" style="display:flex;gap:10px;margin-top:24px">
      <a class="btn btn-primary" th:href="@{/}">대시보드로</a>
      <button class="btn" type="button" onclick="history.back()">이전 페이지</button>
    </div>
  </div>
</div>
<p class="note" style="text-align:center;padding:0 24px 28px">
  JSON API 오류는 이 화면을 렌더하지 않습니다. Accept 헤더에서 HTML이 최우선일 때만 화면을 반환합니다.
  벤더 API 실패는 전체 화면 오류로 처리하지 않고 해당 영역만 재시도 안내로 표시합니다.
</p>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
