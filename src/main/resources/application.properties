spring.application.name=mijang

# 비밀정보(application-secret.properties)는 git 미추적. 비밀번호 등은 여기서 include
spring.profiles.include=secret

# DataSource (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/mijang?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=mijang

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 배치 스케줄러 (개발명세서 '실시간·배치 상세' 시트)
# 아직 구현 전이라 꺼 둔다. true 로 바꾸면 @Scheduled 빈이 등록되고 주기대로 돈다.
mijang.batch.enabled=false
mijang.batch.popular-poll-delay-ms=7000
