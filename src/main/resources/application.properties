spring.application.name=mijang

# 비밀정보(application-secret.properties)는 git 미추적. 비밀번호 등은 여기서 include
spring.profiles.include=secret

# DataSource (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/mijang?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=mijang

# 오류 응답 — 미장-API명세서 1.1 "스택 트레이스·내부 용어 금지"
# devtools 가 개발 모드에서 include-stacktrace 를 켜 버리므로 명시적으로 끈다.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 배치 스케줄러 (개발명세서 '실시간·배치 상세' 시트)
#
# 배치는 전부 구현돼 있다. 개발 중 벤더를 안 부르려고 꺼 둔 것이지 미구현이 아니다.
# true 로 바꾸면 @Scheduled 빈이 등록되고 주기대로 돈다.
#
# 끈 채로 두면 표가 비어 있어 화면이 이렇게 보인다 — 처음 띄울 때 당황하지 않도록 적어 둔다.
#   stocks / daily_prices 없음  → 검색 결과가 아예 안 나온다
#   market_days 없음            → 세션 판정이 기본값으로 빠져 늘 정규장으로 읽힌다
#   fx_quotes / fx_rates 없음   → /api/fx/rates 가 언제나 null 이다
mijang.batch.enabled=false
# 스냅샷 배치 주기. 확인할 때만 덮어쓴다 — 코드의 cron 을 고치면 되돌리는 것을 잊는다
mijang.batch.snapshot-cron=0 0 8 * * TUE-SAT
mijang.batch.popular-poll-delay-ms=7000

# ===== 인증 =====
# Access 30분 / Refresh 14일 (미장-API명세서 1.3)
mijang.jwt.issuer=mijang
mijang.jwt.access-ttl=PT30M
mijang.jwt.refresh-ttl=P14D
# 쿠키 이름. HttpOnly 라 JS 에서 읽지 못한다
mijang.jwt.access-cookie=MIJANG_AT
mijang.jwt.refresh-cookie=MIJANG_RT
# 로컬은 http 라 false. 배포 시 true 로 바꾼다
mijang.jwt.cookie-secure=false

# ===== 외부 API =====
# 키·시크릿은 여기 두지 않는다. application-secret.properties 에서 채운다.
# 아래는 비밀이 아닌 접속 정보(주소·한도·타임아웃)만 둔다.

# SEC EDGAR — 공시·재무제표. API 키가 없는 대신 연락처가 담긴 User-Agent 가 필수다.
# User-Agent 를 빠뜨리면 모든 요청이 403 이다. 실제 이메일은 secret 파일에서 덮어쓴다.
mijang.external.sec.data-base-url=https://data.sec.gov
mijang.external.sec.www-base-url=https://www.sec.gov
mijang.external.sec.user-agent=mijang-dev contact@example.com
# SEC 공정접근 한도는 초당 10회. 분당이 아니라 초당이다.
mijang.external.sec.requests-per-second=10
# 티커→CIK 매핑 캐시 수명. 신규 상장이 반영되는 주기라 하루면 충분하다.
mijang.external.sec.cik-cache-hours=24

# Alpaca — 시세·일봉·배당. 시세는 data, 종목마스터·휴장일은 trading 쪽이다.
mijang.external.alpaca.data-base-url=https://data.alpaca.markets
mijang.external.alpaca.trading-base-url=https://paper-api.alpaca.markets

# Finnhub — 뉴스·기업정보·투자지표 (경제 캘린더는 유료로 전환되어 BLS·연준으로 대체)
mijang.external.finnhub.base-url=https://finnhub.io/api/v1

# BLS(미 노동통계국) — 경제 지표 발표 일정. 키가 필요 없고 iCalendar 로 제공된다.
# CPI·고용지표·PPI·JOLTS 가 발표 시각(ET)까지 들어 있다.
mijang.external.bls.schedule-url=https://www.bls.gov/schedule/news_release/bls.ics
# 발표 일정은 자주 바뀌지 않는다. 반나절이면 충분하다.
mijang.external.bls.cache-hours=12

# Open Exchange Rates — 손익 계산 기준 환율. app-id 는 secret 파일에서 채운다.
# 무료 플랜은 월 1,000회 · 1시간 갱신 · USD 기준 고정이다(미장-fx-구현 2.1).
mijang.fx.base-url=https://openexchangerates.org/api
# 폴링 주기. 벤더가 정시에 갱신하므로 1시간이 상한이자 최적이다.
# 월 720회라 한도 1,000회 안에 재시도 여유까지 들어간다(2.4)
mijang.fx.poll-interval=1h
# 대체 값을 찾을 때 거슬러 올라갈 최대 일수. 연휴가 길어도 열흘이면 충분하다
mijang.fx.substitute-lookback-days=10

# 외부 호출 공통 타임아웃
mijang.external.connect-timeout-ms=3000
mijang.external.read-timeout-ms=10000

# ===== 메일 =====
# false 면 재설정 링크를 발송하지 않고 로그에만 남긴다. 로컬 기본값이다
# 발송 수단. log 면 로그에만 남기고, smtp 면 실제로 보낸다.
# smtp 로 바꾸려면 application-secret.properties 에 spring.mail.host 부터 채워야 한다.
# 없으면 JavaMailSender 가 만들어지지 않아 기동 자체가 실패한다
mijang.mail.transport=log
# 링크 전체를 로그에 남길지. 그 토큰 하나로 남의 비밀번호를 바꿀 수 있어 기본은 끈다.
# 로컬에서 재설정 흐름을 확인할 때만 true 로 바꾼다 (로그에 켜는 법이 안내된다)
mijang.mail.log-links=false
mijang.mail.from=no-reply@mijang.app
# 받는 쪽 메일함에 보이는 이름
# 받은편지함에 보일 발신자 이름 "미장". properties 파일은 ISO-8859-1 로 읽혀
# 한글을 그대로 적으면 메일에서 깨진다 — 가짜 SMTP 로 실측해 확인했다.
mijang.mail.from-name=\ubbf8\uc7a5
# 재설정 링크 앞에 붙일 서비스 주소. 배포 시 실제 도메인으로 바꾼다
mijang.mail.base-url=http://localhost:8080

# ===== 비밀번호 재설정 =====
# 링크 유효 시간. 메일 본문과 화면 안내가 이 값을 함께 쓴다
mijang.password-reset.token-ttl=30m
# 재전송 간격. 이 안에 다시 요청하면 새 링크를 만들지 않는다
mijang.password-reset.resend-cooldown=60s

# ===== 종목 =====
# 검색 결과 최대 건수. 자동완성 드롭다운이 감당할 만한 크기로 자른다
mijang.stock.search-limit=20
# 일봉 수집 시 한 번에 요청할 종목 수. Alpaca 는 심볼을 콤마로 묶어 받는다
mijang.stock.bar-batch-size=100
# 52주 최고·최저를 계산할 기간
mijang.stock.high-low-days=365
# 일봉 피드. 무료 플랜은 최근 SIP 를 거부하므로(403) iex 를 쓴다.
# 유료 플랜으로 올리면 sip 으로 바꾼다
mijang.stock.bar-feed=iex

# ===== 실시간 시세 =====
# 벤더 동시 구독 한도. Alpaca 무료 Basic 이 30이다 — 31부터 405 로 거부당한다(실측)
mijang.market.max-subscriptions=30
# SSE 연결 수명. 브라우저가 알아서 다시 붙으므로 길게 둘 이유가 없다
mijang.market.sse-timeout=30m
# Alpaca 실시간 웹소켓 주소. IEX 피드다
mijang.market.stream-url=wss://stream.data.alpaca.markets/v2/iex
# 장 시간 밖에 쓰는 스트림. IEX 는 그 시간에 체결이 없어 값이 멈춘다
mijang.market.delayed-stream-url=wss://stream.data.alpaca.markets/v2/delayed_sip
# 실시간 수신을 켤지. 끄면 종가만 보여준다 — 테스트와 로컬에서 벤더를 안 부르게 한다
mijang.market.stream-enabled=true
